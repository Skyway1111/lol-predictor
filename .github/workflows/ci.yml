name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor (requires-python); 3.14 is the dev version.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,lint]"
      - name: Ruff
        run: ruff check
      - name: Format
        run: ruff format --check .
      - name: Package boundaries
        run: tach check
      # Fast lane only: the full lane (`-m ""`) is bootstrap / Monte-Carlo / real-DB
      # smokes that run for hours -- unfit for per-push CI.
      - name: Tests (fast lane, all trees)
        run: python -m pytest tests
