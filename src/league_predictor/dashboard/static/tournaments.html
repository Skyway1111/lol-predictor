<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herald — Tournaments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">
    <header class="desk-header" id="desk-header"></header>
    <div class="date-bar page-root" id="date-bar"></div>
    <div class="split-shell page-root">
        <aside class="side-rail">
            <div class="side-head">
                <div class="side-title">Tournaments</div>
                <input id="lg-search" type="search" placeholder="Search leagues">
            </div>
            <div id="lg-rail" class="side-list">
                <div class="loading">Loading leagues</div>
            </div>
        </aside>
        <main class="detail-main" id="tourn-detail">
            <div class="loading">Select a league</div>
        </main>
    </div>
    <footer class="desk-footer" id="desk-footer"></footer>
    <script src="/static/herald.js"></script>
    <script src="/static/tournaments.js"></script>
</body>
</html>
