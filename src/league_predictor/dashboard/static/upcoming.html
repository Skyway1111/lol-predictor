<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herald — Slate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Page-scoped styles: the slate board (day groups + fixture rows). */
        .slate-views { display: flex; gap: 8px; align-items: center; }
        .slate-views .btn.on { border-color: var(--accent, #c8aa6e); color: var(--accent, #c8aa6e); }
        .slate-day { margin: 18px 0 6px; }
        .slate-board .series-hdr { position: static; }
        .urow {
            display: grid;
            grid-template-columns: 72px 110px 1fr 300px 1fr 96px;
            gap: 10px; align-items: center;
            padding: 9px 14px; border-bottom: 1px solid rgba(200, 170, 110, 0.12);
        }
        .urow.dim { opacity: 0.45; }
        .urow .u-time { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
        .urow .u-league { font-size: 12px; letter-spacing: 0.04em; opacity: 0.8;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .urow .u-team { font-size: 14px; }
        .urow .u-team.a { text-align: right; }
        .urow .u-team .fav { font-weight: 700; }
        .urow .u-meta { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            text-align: right; opacity: 0.85; }
        .urow .u-meta .hit { color: #7fd18b; }
        .urow .u-meta .miss { color: #e07a7a; }
        .urow .u-meta .live { color: #e0b57a; }
    </style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">
    <header class="desk-header" id="desk-header"></header>
    <div class="date-bar page-root" id="date-bar"></div>
    <div class="page-root" style="padding-top:10px;">
        <div class="slate-views">
            <span class="label">View</span>
            <button class="btn quiet" id="view-today" type="button">Today</button>
            <button class="btn quiet" id="view-week" type="button">This week</button>
        </div>
        <main class="slate-board" id="slate-board">
            <div class="loading">Loading the slate</div>
        </main>
    </div>
    <footer class="desk-footer" id="desk-footer"></footer>
    <script src="/static/herald.js"></script>
    <script src="/static/upcoming.js"></script>
</body>
</html>
